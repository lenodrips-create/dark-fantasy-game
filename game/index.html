<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forest Starting Level</title>
<style>
  :root { --ink:#e8e4f5; --dim:#a9a2c4; --panel:rgba(14,10,28,.72); }
  html,body { margin:0; height:100%; background:#0b0818; overflow:hidden; font-family: "Trebuchet MS", system-ui, sans-serif; color:var(--ink); }
  canvas { display:block; }
  [hidden] { display:none !important; }
  #overlay { position:fixed; inset:0; display:grid; place-items:center; background:rgba(8,5,20,.55); cursor:pointer; }
  #overlay .card { background:var(--panel); border:1px solid #3b3260; padding:24px 28px; border-radius:10px; text-align:center; max-width:340px; }
  #overlay h1 { margin:0 0 6px; font-size:22px; letter-spacing:.04em; }
  #overlay p { margin:4px 0; color:var(--dim); font-size:14px; }
  #overlay .go { margin-top:14px; color:var(--ink); font-weight:bold; }
  #hud { position:fixed; left:12px; bottom:12px; background:var(--panel); padding:8px 10px; border-radius:6px; font-size:12px; color:var(--dim); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; font-size:16px; color:var(--dim); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">Loading the forest…</div>
<div id="overlay" hidden><div class="card">
  <h1>Forest Starting Level</h1>
  <p>WASD — move &nbsp;·&nbsp; Shift — run</p>
  <p>Space — jump &nbsp;·&nbsp; Mouse — look &nbsp;·&nbsp; Wheel — zoom</p>
  <p>Esc — release mouse</p>
  <p class="go">Click to play</p>
</div></div>
<div id="hud">WASD move · Shift run · Space jump · Esc pause</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.3, 2000);
addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const texLoader = new THREE.TextureLoader();
function tex(name, { repeat=1, nearest=true, srgb=true } = {}) {
  const t = texLoader.load("tex/" + name);
  t.flipY = false;                       // glTF UV convention
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  if (nearest) { t.magFilter = THREE.NearestFilter; }
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// sky: fixed backdrop, like the Blender render
const sky = texLoader.load("tex/night_sky.jpg"); sky.colorSpace = THREE.SRGBColorSpace;
scene.background = sky;

// moonlight
scene.add(new THREE.HemisphereLight(0x9a8ad0, 0x2a2440, 1.6));
const moon = new THREE.DirectionalLight(0xc0b4ff, 2.4);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left:-90, right:90, top:90, bottom:-90, near:1, far:400 });
moon.shadow.bias = -0.0006;
scene.add(moon, moon.target);
const MOON_DIR = new THREE.Vector3(-0.55, 1, 0.45).normalize();

// ---------- materials (rebuilt from the Blender node setups) ----------
const lam = (o) => new THREE.MeshLambertMaterial(o);
const MATS = {
  GrassShaded: lam({ map: tex("grass_seamless.png", { repeat:1/14, nearest:false }), color:0x606060, vertexColors:true }),
  Grass:       lam({ map: tex("grass_seamless.png", { repeat:1/14, nearest:false }), color:0x606060, side:THREE.DoubleSide }),
  WallTex:     lam({ map: tex("wall.png"), side:THREE.DoubleSide }),
  TownStone:   lam({ map: tex("town_stone.png"), side:THREE.DoubleSide }),
  CaveBlack:   new THREE.MeshBasicMaterial({ color:0x000000, side:THREE.DoubleSide }),
  PineTrunk:   lam({ map: tex("pine_trunk.png") }),
  PineLeaves:  lam({ map: tex("pine_leaves.png"), color:0x3a4f3e }),
  HouseWall:   lam({ map: tex("walls_black.png") }),
  HouseRoof:   lam({ map: tex("roof_gray.png") }),
};

// ---------- load level ----------
const [gltf, level] = await Promise.all([
  new GLTFLoader().loadAsync("level.glb"),
  fetch("level.json").then(r => r.json()),
]);
const groundMeshes = [];
gltf.scene.traverse(o => {
  if (!o.isMesh) return;
  const m = MATS[o.material.name];
  if (m) o.material = m;
  o.castShadow = !/Ground|TownStone|Wall/.test(o.name);
  o.receiveShadow = true;
  if (/^(Ground|TownStone|Cave)/.test(o.name)) groundMeshes.push(o);
});
scene.add(gltf.scene);

// ---------- smoky fog patches ----------
const fogImg = await new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = "tex/fog_tex.png"; });
const fogTex = (() => {
  const S = 256, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"); g.imageSmoothingEnabled = true;
  for (let x=0;x<2;x++) for (let y=0;y<2;y++) g.drawImage(fogImg, x*S/2, y*S/2, S/2, S/2);
  const d = g.getImageData(0,0,S,S);
  for (let y=0;y<S;y++) for (let x=0;x<S;x++) {
    const i = (y*S+x)*4, r = Math.hypot(x/S*2-1, y/S*2-1);
    const fall = Math.max(0, Math.min(1, (1-r)/0.65));            // soft round edge
    const lum = d.data[i]/255;
    const a = Math.max(0, Math.min(1, (lum-0.25)/0.65)) * fall * fall * 0.6;
    d.data[i]=200; d.data[i+1]=195; d.data[i+2]=225; d.data[i+3]=a*255;
  }
  g.putImageData(d,0,0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
const fogMat = new THREE.MeshBasicMaterial({ map:fogTex, transparent:true, depthWrite:false, side:THREE.DoubleSide, fog:false });
const fogGeo = new THREE.PlaneGeometry(2,2).rotateX(-Math.PI/2);
for (const [x,y,z,sx,sz,rz] of level.fog) {
  const m = new THREE.Mesh(fogGeo, fogMat);
  m.position.set(x,y,z); m.scale.set(sx,1,sz); m.rotation.y = rz;
  m.renderOrder = 2; scene.add(m);
}

// ---------- knight (placeholder until the real model is exported) ----------
function makeKnight() {
  const k = new THREE.Group();
  const steel = lam({ color:0x9aa0ad }), dark = lam({ color:0x3a3d46 }), cloth = lam({ color:0x5a1f2a }), wood = lam({ color:0x5b3a22 });
  const box = (w,h,d,mat,x,y,z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); m.castShadow = true; k.add(m); return m; };
  const legL = box(0.45,1.2,0.5,dark,-0.3,0.6,0), legR = box(0.45,1.2,0.5,dark,0.3,0.6,0);
  box(1.2,1.3,0.75,steel,0,1.85,0);            // chest plate
  box(1.25,0.5,0.8,cloth,0,1.2,0);             // tabard
  box(0.75,0.75,0.75,steel,0,2.9,0);           // helmet
  box(0.6,0.1,0.05,dark,0,2.95,0.39);          // visor slit
  box(0.12,0.45,0.12,cloth,0,3.45,-0.05);      // plume
  const armL = box(0.35,1.1,0.4,steel,-0.8,1.9,0), armR = box(0.35,1.1,0.4,steel,0.8,1.9,0);
  const shield = box(0.12,1.1,0.9,wood,-1.05,1.8,0.1);
  const sword = new THREE.Group(); sword.position.set(0.85,1.35,0.25);
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1,1.7,0.18), lam({ color:0xd8dce6 })); blade.position.y = 0.95; blade.castShadow = true;
  const guard = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.1,0.18), dark); guard.position.y = 0.1;
  sword.add(blade, guard); sword.rotation.x = 0.5; k.add(sword);
  k.scale.setScalar(1.05);                     // ~3.6 m tall, in scale with the houses
  k.userData = { legL, legR, armL, armR };
  return k;
}
// the real knight model (exported from SketchUp), with the box knight as a fallback
let knight;
try {
  const k = (await new GLTFLoader().loadAsync("knight.glb")).scene;
  k.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  knight = new THREE.Group(); knight.add(k); knight.userData = { model:k };
} catch (e) { console.warn("knight.glb failed, using placeholder", e); knight = makeKnight(); }
scene.add(knight);

// ---------- collision data ----------
const circles = [
  ...level.trees.map(([x,,z,r]) => [x,z,r]),
  ...level.houses.map(([x,,z,r]) => [x,z,r]),
  ...level.rocks.map(([x,,z,r]) => [x,z,r]),
];
const PLAYER_R = 0.9;
const down = new THREE.Raycaster(); down.far = 600;
const DOWN = new THREE.Vector3(0,-1,0);
function groundAt(x, z) {
  down.set(new THREE.Vector3(x, 300, z), DOWN);
  const hit = down.intersectObjects(groundMeshes, false)[0];
  return hit ? hit.point.y : null;
}

// ---------- player state ----------
const [sx, sy, sz] = level.spawn;
const player = { pos:new THREE.Vector3(sx, sy, sz), vy:0, onGround:true, facing:0 };
// face roughly toward the centre of the map from the spawn corner
player.facing = Math.atan2(-sx, -sz);
let yaw = player.facing + Math.PI, pitch = 0.32, dist = 14;

// ---------- input ----------
const keys = {};
addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Space") e.preventDefault(); });
addEventListener("keyup",   e => { keys[e.code] = false; });
const overlay = document.getElementById("overlay");
overlay.addEventListener("click", () => {
  overlay.hidden = true;                                      // drag-to-look still works if pointer lock is refused
  try { const p = renderer.domElement.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch {}
});
let wasLocked = false;
document.addEventListener("pointerlockchange", () => {
  const locked = document.pointerLockElement === renderer.domElement;
  if (wasLocked && !locked) overlay.hidden = false;           // Esc pauses
  wasLocked = locked;
});
addEventListener("mousemove", e => {
  if (document.pointerLockElement !== renderer.domElement && !(e.buttons & 1)) return;
  yaw   -= e.movementX * 0.0025;
  pitch  = Math.max(-0.35, Math.min(1.2, pitch + e.movementY * 0.0025));
});
addEventListener("wheel", e => { dist = Math.max(6, Math.min(40, dist + e.deltaY * 0.02)); });

// ---------- update ----------
const clock = new THREE.Clock();
let walkT = 0;
function update(dt) {
  const fwd = (keys.KeyW?1:0) - (keys.KeyS?1:0);
  const str = (keys.KeyD?1:0) - (keys.KeyA?1:0);
  const run = keys.ShiftLeft || keys.ShiftRight;
  const speed = run ? 20 : 10;
  let moving = false;
  if (fwd || str) {
    // camera-relative movement
    const camF = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
    const camR = new THREE.Vector3(-camF.z, 0, camF.x);
    const dir = camF.multiplyScalar(fwd).add(camR.multiplyScalar(str)).normalize();
    const nx = player.pos.x + dir.x * speed * dt, nz = player.pos.z + dir.z * speed * dt;
    let px = nx, pz = nz;
    for (const [cx,cz,r] of circles) {          // push out of trees / houses / rocks
      const dx = px-cx, dz = pz-cz, d = Math.hypot(dx,dz), min = r + PLAYER_R;
      if (d < min && d > 1e-4) { px = cx + dx/d*min; pz = cz + dz/d*min; }
    }
    if (groundAt(px, pz) !== null) { player.pos.x = px; player.pos.z = pz; }   // walls: no ground beyond the edge
    player.facing = Math.atan2(dir.x, dir.z);
    moving = true;
  }
  // gravity + jump
  const gy = groundAt(player.pos.x, player.pos.z) ?? player.pos.y;
  if (player.onGround && keys.Space) { player.vy = 13; player.onGround = false; }
  player.vy -= 32 * dt;
  player.pos.y += player.vy * dt;
  if (player.pos.y <= gy) { player.pos.y = gy; player.vy = 0; player.onGround = true; }
  else if (player.pos.y - gy > 0.3) player.onGround = false;

  // knight pose
  knight.position.copy(player.pos);
  const cur = knight.rotation.y, tgt = player.facing;
  knight.rotation.y = cur + Math.atan2(Math.sin(tgt-cur), Math.cos(tgt-cur)) * Math.min(1, dt*12);
  walkT += moving ? dt * (run ? 14 : 9) : 0;
  const sw = moving && player.onGround ? Math.sin(walkT) * 0.6 : 0;
  const ud = knight.userData;
  if (ud.legL) { ud.legL.rotation.x = sw; ud.legR.rotation.x = -sw; ud.armL.rotation.x = -sw*0.6; ud.armR.rotation.x = sw*0.6; }
  else {   // the imported knight has no rig, so give it a little stomp-and-sway while walking
    ud.model.position.y = Math.abs(Math.sin(walkT)) * (moving && player.onGround ? 0.18 : 0);
    ud.model.rotation.z = sw * 0.08;
  }

  // third-person camera on a spring arm
  const target = player.pos.clone().add(new THREE.Vector3(0, 3.2, 0));
  const off = new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(dist);
  const want = target.clone().add(off);
  const cg = groundAt(want.x, want.z);
  if (cg !== null && want.y < cg + 1.5) want.y = cg + 1.5;  // keep the camera above the hills
  camera.position.lerp(want, Math.min(1, dt*10));
  camera.lookAt(target);

  // shadows follow the player
  moon.target.position.copy(player.pos);
  moon.position.copy(player.pos).addScaledVector(MOON_DIR, 200);
}

document.getElementById("loading").remove();
overlay.hidden = false;
knight.position.copy(player.pos);
camera.position.set(player.pos.x + Math.sin(yaw)*dist, player.pos.y + 8, player.pos.z + Math.cos(yaw)*dist);

renderer.setAnimationLoop(() => {
  update(Math.min(clock.getDelta(), 0.05));
  renderer.render(scene, camera);
});
window.__game = { player, keys, setYaw: v => yaw = v };   // handy for debugging
</script>
</body>
</html>
